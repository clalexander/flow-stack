packages:
  - examples/*

# Every resolved version, including transitive ones, must be at least 2 days old: the shortest
# Dependabot cooldown (patch updates). Setting it explicitly makes pnpm enforce it strictly.
# Exceptions go in minimumReleaseAgeExclude as exact versions, each with a reason.
minimumReleaseAge: 2880

audit:
  ignore:
    # minimatch 9 via eslint-plugin-sort-exports. The only fix is minimatch 11, two majors ahead.
    # Exposure is lint-time globs from repository config. Remove once eslint-plugin-sort-exports
    # supports minimatch >=11.0.1, or is replaced.
    - GHSA-g3hv-75wg-m249

overrides:
  # Security floors are patched minimums, not exact pins, so later fixes still flow in. Remove a
  # floor once every dependent requires a patched version.
  # GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7, GHSA-q2hr-2g5m-vwhr, via minimatch 3, 9, and 11.
  brace-expansion@^1: ^1.1.21
  brace-expansion@^2: ^2.1.7
  brace-expansion@^5: ^5.0.12
  browserslist: 4.28.8
  esbuild@<=0.24.2: ^0.25.0
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  nanoid: 3.3.18
  postcss: 8.5.23
  # 18 undici 7 advisories fixed by 7.30.1, via jsdom, @actions/http-client, and
  # @semantic-release/github.
  undici: ^7.30.1
  vite@<=6.4.1: ^6.4.2
  vite@<=6.4.2: ^6.4.3
update:
  ignoreDeps:
    # Remove once eslint-plugin-react and eslint-plugin-jsx-a11y support ESLint 10.
    - '@eslint/js'
    - eslint
    # Remove once typescript-eslint supports TypeScript 7.
    - typescript
    # React majors are owned by the React compatibility watcher.
    - react
    - react-dom
    - '@types/react'
    - '@types/react-dom'
allowBuilds:
  esbuild: true
  unrs-resolver: false
