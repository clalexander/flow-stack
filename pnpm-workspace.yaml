packages:
  - examples/*

overrides:
  brace-expansion@^1: 1.1.18
  brace-expansion@^2: 2.1.4
  brace-expansion@^5: 5.0.9
  browserslist: 4.28.8
  esbuild@<=0.24.2: ^0.25.0
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  nanoid: 3.3.18
  postcss: 8.5.23
  undici: 7.29.0
  vite@<=6.4.1: ^6.4.2
  vite@<=6.4.2: ^6.4.3
update:
  ignoreDeps:
    # Remove once eslint-plugin-react and eslint-plugin-jsx-a11y support ESLint 10.
    - '@eslint/js'
    - eslint
    # Remove once typescript-eslint supports TypeScript 7.
    - typescript
    # React majors are owned by the React compatibility watcher.
    - react
    - react-dom
    - '@types/react'
    - '@types/react-dom'
allowBuilds:
  esbuild: true
  unrs-resolver: false
