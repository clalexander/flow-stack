version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/New_York
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
    open-pull-requests-limit: 1
    target-branch: dev
    # Dependabot scopes dev-only groups as chore(deps-dev), which intentionally does not release.
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - automated
    groups:
      npm-dependencies:
        patterns:
          - '*'

    # React major upgrades are owned by the React compatibility watcher.
    ignore:
      - dependency-name: react
        update-types:
          - version-update:semver-major
      - dependency-name: react-dom
        update-types:
          - version-update:semver-major
      - dependency-name: '@types/react'
        update-types:
          - version-update:semver-major
      - dependency-name: '@types/react-dom'
        update-types:
          - version-update:semver-major
      # Remove once eslint-plugin-react and eslint-plugin-jsx-a11y support ESLint 10.
      - dependency-name: '@eslint/js'
        versions:
          - '>=10.0.0'
      - dependency-name: eslint
        versions:
          - '>=10.0.0'
      # Remove once typescript-eslint supports TypeScript >=6.1.0.
      - dependency-name: typescript
        versions:
          - '>=6.1.0'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: America/New_York
    open-pull-requests-limit: 1
    target-branch: dev
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - github-actions
      - automated
    groups:
      github-actions:
        patterns:
          - '*'
