version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Chicago
    open-pull-requests-limit: 10
    target-branch: dev
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - automated
    groups:
      production-minor-patch-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
        exclude-patterns:
          - react
          - react-dom

      development-minor-patch-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
        exclude-patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'

    ignore:
      - dependency-name: react
        update-types:
          - version-update:semver-major
      - dependency-name: react-dom
        update-types:
          - version-update:semver-major
      - dependency-name: '@types/react'
        update-types:
          - version-update:semver-major
      - dependency-name: '@types/react-dom'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: America/Chicago
    open-pull-requests-limit: 10
    target-branch: dev
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - github-actions
      - automated
