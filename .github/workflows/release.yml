name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry-run:
        description: Evaluate the next release without publishing or repository mutation
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml

  release:
    name: Release
    if: >-
      ${{ github.event_name == 'push' ||
      (!inputs.dry-run && github.ref == 'refs/heads/main') }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Create release automation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          GIT_AUTHOR_EMAIL: ${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          GIT_COMMITTER_EMAIL: ${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          git_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          echo "::add-mask::$git_auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $git_auth"

          pnpm exec semantic-release

  release-dry-run:
    name: Release dry run
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
      inputs.dry-run && github.ref == 'refs/heads/main' }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Evaluate release without mutation
        env:
          RELEASE_ANALYSIS_ONLY: 'true'
        run: |
          set -euo pipefail

          dry_run_remote="$RUNNER_TEMP/flow-stack-release-dry-run.git"
          git clone --bare . "$dry_run_remote"

          pnpm exec semantic-release \
            --dry-run \
            --no-ci \
            --repository-url "file://$dry_run_remote"

  sync-main-into-dev:
    name: Open sync PR to dev
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Create release automation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write

      - name: Open back-merge PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          owner="${REPO%%/*}"
          main_sha="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          ahead_by="$(gh api "repos/$REPO/compare/dev...main" --jq '.ahead_by')"
          if [[ "$ahead_by" -eq 0 ]]; then
            echo "No commits need to be synchronized from main at $main_sha into dev."
            exit 0
          fi

          matching_prs="$(gh pr list \
            --repo "$REPO" \
            --base dev \
            --head "$owner:main" \
            --state open \
            --json headRefOid,headRepository,number \
            --jq "[.[] | select(.headRepository.nameWithOwner == \"$REPO\" and .headRefOid == \"$main_sha\")]")"
          if [[ "$(jq 'length' <<<"$matching_prs")" -gt 0 ]]; then
            echo "A sync PR from main at $main_sha to dev already exists."
            exit 0
          fi

          pr_url="$(gh pr create \
            --repo "$REPO" \
            --base dev \
            --head main \
            --title "chore: sync main into dev" \
            --body "Automated post-release sync PR from \`main\` at \`$main_sha\` into \`dev\`.")"
          echo "Created sync PR $pr_url from main at $main_sha to dev."
