name: CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main
      - dev
      - 'release/**'
      - 'hotfix/**'
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Verify dependency signatures
        run: npm audit signatures

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

  compatibility:
    name: Compatibility (Node ${{ matrix.node }}, React ${{ matrix.react }})
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node:
          - '20'
          - '22'
          - '24'
        react:
          - '18'
          - '19'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install

      - name: Install React compatibility version
        run: >
          npm install
          --no-save
          --package-lock=false
          react@${{ matrix.react }}
          react-dom@${{ matrix.react }}
          @types/react@${{ matrix.react }}
          @types/react-dom@${{ matrix.react }}

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
